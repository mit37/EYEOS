# EyeOS config. Copy to config.yaml and edit; config.yaml is gitignored-by-convention
# (it's local calibration/tuning, not a secret, but keep your own out of commits).
# No API keys live here — EyeOS calls no paid API.

# The primary screen's size as the OS reports it (after display scaling). Calibration
# dots, no-click zones and cursor output all use these pixels; a mismatch is refused.
screen:
  width_px: 1920
  height_px: 1080

input:
  # webcam | video_file | synthetic
  source: synthetic
  device_index: 0 # webcam only
  video_path: null # video_file only
  synthetic_path: eval/fixtures/synthetic_session.csv # synthetic only

calibration:
  points: 9 # fixed by PRD §3; other values are rejected

filter:
  # One Euro filter (Casiez et al. 2012)
  min_cutoff: 1.0
  beta: 0.02
  d_cutoff: 1.0

gates:
  presence_confidence_threshold: 0.5
  calibration_max_error_px: 60.0
  calibration_max_head_pose_delta_deg: 15.0
  dwell_time_s: 0.8
  dwell_jitter_px: 20.0
  max_cursor_speed_px_s: 4000.0
  max_clicks_per_window: 5
  click_window_s: 10.0
  confirmation_hold_s: 0.4
  # How a click is confirmed: either | blink_hold | keypress (PRD §2).
  # keypress also turns off the blink grace window, so closed eyes fail Gate 1 at once.
  # keypress needs output.confirm_key set (a config without one is refused). Dry runs
  # don't listen to the keyboard, so a keypress-mode dry run can't confirm any click.
  confirmation_mode: either
  # A longer gap between frames (a camera stall) fails Gate 1 for that frame.
  max_frame_gap_s: 0.25
  no_click_zones:
    # Example: the Windows taskbar close-button area, on a 1920x1080 screen.
    - x_min: 1860
      y_min: 0
      x_max: 1920
      y_max: 40

output:
  # dry_run | windows_sendinput | pynput
  backend: dry_run
  # One press stops the session (Gate 4). Needs pynput for any non-dry_run backend.
  kill_hotkey: "esc"
  # Key held to confirm a click (keypress/either modes). null = no confirm key, which
  # only blink_hold/either modes allow. Needs pynput and a non-dry_run backend.
  # It is read globally and not swallowed: pressing it in ANY app while a dwell holds
  # clicks at the gaze point. Use a key you never type with (e.g. f9), not space or a
  # letter.
  confirm_key: null

logging:
  # One JSON line per frame with every gate's decision and reason (PRD §2).
  # `eyeos run` writes logs/session-<UTC time>.jsonl by default; null disables it.
  session_log_dir: logs
